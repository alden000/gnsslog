name: Android APK

on:
  push:
    branches: [main, claude/vessel-tracking-pwa-w2jav3]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Release signing when the repo has the secrets (Settings -> Secrets and variables -> Actions):
      #   GNSSLOG_KEYSTORE_B64      base64 of gnsslog-release.p12
      #   GNSSLOG_KEYSTORE_PASSWORD its password
      # Without them a debug-signed APK is built.
      - name: Release key
        env:
          KS_B64: ${{ secrets.GNSSLOG_KEYSTORE_B64 }}
        if: ${{ env.KS_B64 != '' }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "GNSSLOG_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          GNSSLOG_KEYSTORE_PASSWORD: ${{ secrets.GNSSLOG_KEYSTORE_PASSWORD }}
        run: bash tools/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gnss-log-apk
          path: GNSS-Log-*.apk
