name: Android APK

on:
  push:
    branches: [main, claude/vessel-tracking-pwa-w2jav3]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build APK
        run: bash tools/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gnss-log-apk
          path: GNSS-Log-*.apk
